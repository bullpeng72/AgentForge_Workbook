[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.0.0"
description = "《AgentForge 실습서》 예제 — 자연어 브리프에서 재사용 가능한 CrewAI 멀티에이전트 팀을 생성하는 도구"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "crewai>=0.65.0,<1.0.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "agent-evaluator[sdk]",
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.5.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 패키지는 src-layout(pip install -e .로 해석), 테스트 헬퍼(tests/unit/fakes.py)는
# `tests.unit.fakes`로 임포트한다 — 이 옵션이 없으면 `python -m pytest`로는 되고
# bare `pytest`/CI에서는 `tests` 패키지 해석이 깨진다(실측, PYTHONPATH=src만으론
# 안 됨 — -m 호출이 암묵적으로 붙여주던 cwd를 안 붙여줘서).
pythonpath = ["."]
