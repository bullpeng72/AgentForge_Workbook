[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.0.0"
description = "《AgentForge 실습서》 예제 — 자연어 브리프에서 재사용 가능한 CrewAI 멀티에이전트 팀을 생성하는 도구"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "crewai>=0.65.0,<1.0.0",
    "pydantic>=2.0,<3.0",
    "agent-evaluator[sdk]",
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
